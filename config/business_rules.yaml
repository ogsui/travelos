# =============================================================================
# PLACEHOLDER FILE — PRICING IS BLOCKED UNTIL THE OWNER FILLS THIS IN.
#
# Every value below is intentionally null/empty. `load_pricing_rules()` reports
# NEEDS_CONFIG for each null, so TravelOS refuses to calculate or quote a price.
# Do not invent margin, tax, FX or fee values: all `# ACCOUNTANT` items need
# accountant sign-off, and the tax rules live in a separately approved table
# (only the table version is referenced here).
#
# Fill in, have the owner approve, then commit a new `version`.
# =============================================================================
